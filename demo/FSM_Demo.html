<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QEY FSM — Field Service Management (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2e;--navy2:#152540;--navy3:#1e3356;
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-m:#378ADD;--blue-d:#0C447C;
  --accent:#0ea5e9;--teal:#0d9488;
  --text:#0d1b2e;--muted:#64748b;--border:#e2e8f0;
  --bg:#f1f5f9;--white:#fff;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--purple:#7c3aed;
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--navy);color:#fff;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:200;border-bottom:2px solid var(--blue)}
.topbar-brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:28px;height:28px;background:var(--blue);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#fff;letter-spacing:.05em}
.brand-name{font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.07em}
.brand-sub{font-size:11px;color:rgba(255,255,255,.5);margin-left:4px}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-date{font-size:11px;color:rgba(255,255,255,.45);font-family:var(--mono)}
.user-chip{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
.user-avatar{width:22px;height:22px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600}
.user-name{font-size:12px;color:rgba(255,255,255,.85);font-weight:500}
.user-role-tag{font-size:9px;padding:2px 6px;border-radius:10px;background:#042C53;color:#B5D4F4;font-weight:600}

.shell{display:flex;height:calc(100vh - 54px)}

/* SIDEBAR */
.sidebar{width:225px;flex-shrink:0;background:var(--navy2);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto}
.sidebar-section{padding:16px 14px 4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3)}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.55);border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff;border-left-color:var(--accent);background:rgba(14,165,233,.12)}
.nav-item i{font-size:15px;flex-shrink:0}
.nav-badge{margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;background:rgba(24,95,165,.3);color:#60a5fa}
.sidebar-foot{margin-top:auto;padding:14px;font-size:10px;color:rgba(255,255,255,.3);line-height:1.6}

.main{flex:1;overflow-y:auto;padding:24px}
.view{display:none}.view.active{display:block}

.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-title{font-size:20px;font-weight:600}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px}

.btn{font-family:var(--sans);font-size:12px;font-weight:500;padding:7px 14px;border-radius:6px;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-d)}
.btn-outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn-outline:hover{background:var(--blue-l)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-card.b{border-top:3px solid var(--blue)}.stat-card.g{border-top:3px solid var(--green)}
.stat-card.a{border-top:3px solid var(--amber)}.stat-card.p{border-top:3px solid var(--purple)}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-meta{font-size:11px;color:var(--muted);margin-top:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}
.tbl th{background:#f8fafc;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:9px 14px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:11px 14px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#fafbfc}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .18s}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--blue);box-shadow:0 4px 16px rgba(24,95,165,.12);transform:translateY(-1px)}
.card-head{background:var(--navy2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff}
.card-name{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.03em}
.card-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:2px}
.card-body{padding:14px 16px}
.card-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fafbfc;font-size:11px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-flex;align-items:center;border-radius:4px;padding:2px 6px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.bg-slate{background:#f1f5f9;color:#475569}.bg-blue{background:#dbeafe;color:#1d4ed8}
.bg-amber{background:#fef3c7;color:#92400e}.bg-green{background:#d1fae5;color:#065f46}
.bg-indigo{background:#e0e7ff;color:#4338ca}.bg-teal{background:#ccfbf1;color:#0f766e}
.bg-sky{background:#e0f2fe;color:#0369a1}.bg-violet{background:#ede9fe;color:#6d28d9}
.bg-rose{background:#ffe4e6;color:#9f1239}

.progress{height:6px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:4px}
.progress > div{height:100%;border-radius:99px;background:var(--blue)}

/* folder browser */
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:16px}
.crumb a{color:var(--blue);cursor:pointer}
.folder-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;margin-bottom:4px}
.folder-item:hover{border-color:var(--blue);background:var(--blue-l)}
.folder-item i{font-size:20px;color:var(--blue)}

/* schedule */
.sched{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg)}
.sched table{min-width:880px}
.sched th{background:#f8fafc;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px;text-align:left;border-bottom:1px solid var(--border)}
.sched td{border-bottom:1px solid var(--border);border-left:1px solid var(--border);padding:6px;vertical-align:top;min-width:130px}
.sched td:first-child{border-left:none;font-size:12px;font-weight:600;min-width:150px}
.chip{border:1px solid var(--border);border-radius:6px;padding:6px;margin-bottom:5px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chip-title{font-size:11px;font-weight:500;line-height:1.25;margin-bottom:2px}
.chip-sub{font-size:10px;color:var(--muted);margin-bottom:4px}
.chip-row{display:flex;align-items:center;justify-content:space-between;gap:4px}
.chip select{font-size:9px;border:1px solid var(--border);border-radius:4px;padding:1px;color:var(--muted);max-width:84px}

/* forms */
.form-wrap{max-width:760px}
.fsection{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.fsection-head{background:#f8fafc;border-bottom:1px solid var(--border);padding:10px 16px;font-size:13px;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.field label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font-family:var(--sans);font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:5px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.08)}
.field.col2{grid-column:span 2}
.field .unit{display:flex;align-items:center;gap:8px}
.field .warn{color:var(--red);font-size:10px;font-weight:500;margin-top:3px}
.req{color:var(--red)}
.banner{border-radius:6px;padding:10px 14px;font-size:12px;margin-bottom:14px}
.banner.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.banner.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;margin-top:6px}
canvas.sig{width:100%;height:90px;border:1px solid var(--border);border-radius:6px;background:#fff;touch-action:none;cursor:crosshair}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(13,27,46,.6);z-index:500;display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);width:480px;max-width:calc(100vw - 32px);overflow:hidden;max-height:86vh;display:flex;flex-direction:column}
.modal-head{background:var(--navy2);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:14px;font-weight:600}
.modal-head i{cursor:pointer;color:rgba(255,255,255,.7)}
.modal-body{padding:12px;overflow-y:auto}

.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;transform:translateY(70px);opacity:0;transition:all .25s;z-index:999;border-left:3px solid var(--green)}
.toast.show{transform:translateY(0);opacity:1}
.toast.err{border-left-color:var(--red)}
.live-badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600;background:#d1fae5;color:#065f46}
</style>
</head>

function renderSchedule(){
 const days=[...Array(6)].map((_,i)=>{const m=monday();m.setDate(m.getDate()+i);return {iso:m.toISOString().slice(0,10),label:m.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})};});
 const unassigned=JOBS.filter(j=>!j.eng);
 $('#view-schedule').innerHTML=`
 <div class="page-header"><div><div class="page-title">Schedule &amp; Dispatch</div><div class="page-sub">This week — engineers × days. PPM jobs auto-materialise from frequency rules.</div></div>
  <div style="display:flex;gap:8px"><span class="live-badge"><i class="ti ti-wifi"></i> Interactive demo</span><button class="btn btn-outline" onclick="runMaterializer()"><i class="ti ti-player-play"></i> Run materializer</button></div></div>
 <div class="sched"><table><thead><tr><th>Engineer</th>${days.map(d=>`<th>${d.label}</th>`).join('')}</tr></thead><tbody>
 ${ENGINEERS.map(e=>`<tr><td>${e.name}<div style="font-size:10px;font-weight:400;color:var(--muted)">${e.role}</div></td>${days.map(d=>{
   const cell=JOBS.filter(j=>j.eng===e.id&&j.start===d.iso);
   return `<td>${cell.map(j=>jobChip(j)).join('')}</td>`;
 }).join('')}</tr>`).join('')}
 </tbody></table></div>
 ${unassigned.length?`<div style="margin-top:16px"><div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">Unassigned backlog</div><div style="display:flex;flex-wrap:wrap;gap:8px">${unassigned.map(j=>`<div style="width:210px">${jobChip(j)}</div>`).join('')}</div></div>`:''}`;
}
function jobChip(j){
 const opts=TRANSITIONS[j.status]||[];
 return `<div class="chip"><div class="chip-title">${j.title}</div><div class="chip-sub">${siteName(j.siteId)}</div>
  <div class="chip-row">${statusPill(j.status)}${opts.length?`<select onchange="advance('${j.id}',this.value)"><option value="">→</option>${opts.map(o=>`<option value="${o}">${o.replace('_',' ')}</option>`).join('')}</select>`:''}</div></div>`;
}
window.advance=function(id,to){if(!to)return;const j=JOBS.find(x=>x.id===id);if(!(TRANSITIONS[j.status]||[]).includes(to)){toast('Illegal transition '+j.status+' → '+to,true);return;}j.status=to;toast(j.title.split(' — ')[0]+' → '+to.replace('_',' '));renderSchedule();}
window.runMaterializer=function(){
 // emulate the PPM materializer: create upcoming jobs from frequency rules that aren't already scheduled
 const rules=[{siteId:'s-dc2',asset:'DMMB-FW3',scope:'six_month',title:'Fan Wall PPM — DMMB-FW3',clientId:'c-qst',eng:'e4'},
              {siteId:'s-f102',asset:'F102-CH1',scope:'one_year',title:'Chiller Annual PPM — F102-CH1',clientId:'c-fin',eng:'e1'}];
 let added=0;
 rules.forEach(r=>{const exists=JOBS.some(j=>j.title===r.title);if(!exists){JOBS.push({id:'jm'+(JOBS.length+1),type:'ppm',status:'scheduled',start:wd(3+added),...r});added++;}});
 toast(`Materializer: +${added} jobs (${rules.length-added} already existed, ${rules.length} rules checked)`);
 renderSchedule();
}

 <div class="card-grid" style="margin-bottom:24px">${ppm.map(card).join('')}</div>
 <div style="margin-bottom:8px;font-size:13px;font-weight:600"><i class="ti ti-tools" style="color:var(--green)"></i> Service / corrective forms</div>
 <div class="card-grid">${svc.map(card).join('')}</div>`;
}

let cur=null; // {tpl, answers, completed, signed}
window.openForm=function(key){
 const tpl=TEMPLATES.find(t=>t.key===key);
 cur={tpl,answers:{},completed:false,signed:false};
 drawForm();
}
function drawForm(){
 const t=cur.tpl;
 const field=(f)=>{
  const v=cur.answers[f.key]??'';const dis=cur.completed?'disabled':'';
  if(f.type==='textarea')return `<textarea ${dis} oninput="setA('${f.key}',this.value)">${v}</textarea>`;
  if(f.type==='select')return `<select ${dis} onchange="setA('${f.key}',this.value)"><option value="">—</option>${f.options.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`;
  if(f.type==='checkbox')return `<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)"><input type="checkbox" ${dis} ${v?'checked':''} onchange="setA('${f.key}',this.checked)" style="width:16px;height:16px;accent-color:var(--blue)"> Done / verified</label>`;
  if(f.type==='date')return `<input type="date" ${dis} value="${v}" onchange="setA('${f.key}',this.value)">`;
  if(f.type==='number')return `<input type="number" ${dis} value="${v}" oninput="setA('${f.key}',this.value)">`;
  if(f.type==='reading'){const oor=v!==''&&((f.min!=null&&+v<f.min)||(f.max!=null&&+v>f.max));
   return `<div class="unit"><input type="number" ${dis} value="${v}" oninput="setA('${f.key}',this.value)" style="${oor?'border-color:var(--red)':''}">${f.unit?`<span style="font-size:12px;color:var(--muted)">${f.unit}</span>`:''}</div>${oor?`<div class="warn">Outside pass band (${f.min??'–'}–${f.max??'–'} ${f.unit})</div>`:''}`;}
  if(f.type==='attachment')return `<button class="btn btn-outline btn-sm" style="width:100%;justify-content:center;border-style:dashed" onclick="toast('Photo upload (demo)')"><i class="ti ti-paperclip"></i> Add photos</button>`;
  if(f.type==='signature')return `<div style="font-size:11px;color:var(--muted)">Captured in the Sign-off panel.</div>`;
  return `<input ${dis} value="${v}" oninput="setA('${f.key}',this.value)">`;
 };
 const sectionsHtml=t.sections.map(s=>`<div class="fsection"><div class="fsection-head">${s.title}</div><div class="fgrid">${s.fields.map(f=>`<div class="field ${(f.type==='textarea'||f.type==='attachment')?'col2':''}"><label>${f.label} ${f.required?'<span class="req">*</span>':''}</label>${field(f)}</div>`).join('')}</div></div>`).join('');
 const missing=cur.missing||[];const warns=cur.warnings||[];
 $('#view-forms').innerHTML=`
 <div class="page-header"><div><div class="page-title">${t.title}</div><div class="page-sub">${cur.completed?'Completed':'Live demo — auto-saves locally · fill required fields to complete'}</div></div>
  <div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="renderForms()">Back to templates</button>${cur.completed?'':`<button class="btn btn-primary" onclick="completeForm()"><i class="ti ti-check"></i> Complete</button>`}</div></div>
 ${missing.length?`<div class="banner err"><b>Required fields missing:</b> ${missing.join(', ')}</div>`:''}
 ${cur.completed?`<div class="banner ok"><b><i class="ti ti-check"></i> Completed.</b>${warns.length?` <span style="color:#b45309">Out-of-band readings noted: ${warns.join(', ')}</span>`:''}</div>`:''}
 <div class="form-wrap">${sectionsHtml}
 ${cur.completed?`<div class="fsection"><div class="fsection-head">Sign-off &amp; report</div><div class="fgrid">
   <div class="field"><label>Engineer Signature ${cur.signed?'<span style="color:var(--green)">✓ signed</span>':''}</label><canvas class="sig" id="sigpad" width="320" height="90"></canvas>
   <div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-outline btn-sm" onclick="clearSig()"><i class="ti ti-eraser"></i> Clear</button><button class="btn btn-primary btn-sm" onclick="saveSig()"><i class="ti ti-check"></i> Save signature</button></div></div>
   <div class="field" style="display:flex;flex-direction:column;justify-content:space-between"><div style="font-size:12px;color:var(--muted)">Generate the branded PDF report; it would be stored and auto-filed into the site's report folder.</div>
   <button class="btn btn-primary" style="margin-top:10px" onclick="generateReport()"><i class="ti ti-file-text"></i> Generate PDF report</button></div>
 </div></div>`:''}
 </div>`;
 if(cur.completed)initSig();
}
window.setA=function(k,v){cur.answers[k]=v;
 // live out-of-range repaint only for readings (cheap: redraw on blur via re-render not needed each keystroke)
 const f=cur.tpl.sections.flatMap(s=>s.fields).find(x=>x.key===k);
 if(f&&f.type==='reading')drawForm();
};
window.completeForm=function(){
 const miss=[];const warns=[];
 cur.tpl.sections.forEach(s=>s.fields.forEach(f=>{
  if(f.type==='signature'||f.type==='attachment')return;
  const v=cur.answers[f.key];const empty=v===undefined||v===null||v==='';
  if(f.required&&empty)miss.push(f.label);
  if(f.type==='reading'&&!empty&&((f.min!=null&&+v<f.min)||(f.max!=null&&+v>f.max)))warns.push(`${f.label} (${v}${f.unit||''})`);
 }));
 if(miss.length){cur.missing=miss;cur.warnings=[];drawForm();toast('Required fields missing',true);return;}
 cur.missing=[];cur.warnings=warns;cur.completed=true;drawForm();toast('Form completed'+(warns.length?' — with warnings':''));
}

/* signature pad */
let sigCtx,sigDrawing=false,sigDirty=false;
function initSig(){const c=$('#sigpad');if(!c)return;sigCtx=c.getContext('2d');sigCtx.lineWidth=2;sigCtx.lineCap='round';sigCtx.strokeStyle='#0d1b2e';
 const pos=e=>{const r=c.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)};};
 const down=e=>{sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault();};
 const move=e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigDirty=true;e.preventDefault();};
 const up=()=>{sigDrawing=false;};
 c.onmousedown=down;c.onmousemove=move;c.onmouseup=up;c.onmouseleave=up;
 c.ontouchstart=down;c.ontouchmove=move;c.ontouchend=up;
}
window.clearSig=function(){const c=$('#sigpad');if(c){sigCtx.clearRect(0,0,c.width,c.height);sigDirty=false;}}
window.saveSig=function(){if(!sigDirty){toast('Draw a signature first',true);return;}cur.signed=true;cur.sigData=$('#sigpad').toDataURL('image/png');toast('Signature saved');drawForm();}

/* printable PDF report */
window.generateReport=function(){
 const t=cur.tpl,a=cur.answers;
 const rows=s=>s.fields.filter(f=>f.type!=='signature').map(f=>{let v=a[f.key];if(v===undefined||v===''||v===null)v='—';if(f.type==='checkbox')v=a[f.key]?'✓ Yes':'—';if(f.type==='reading'&&a[f.key]&&f.unit)v=a[f.key]+' '+f.unit;return `<tr><td class="k">${f.label}</td><td>${v}</td></tr>`;}).join('');
 const sig=cur.sigData?`<img src="${cur.sigData}" style="max-height:64px"/>`:'<span style="color:#94a3b8">Not signed</span>';
 const html=`<!doctype html><html><head><meta charset="utf-8"><title>${t.title}</title><style>
  body{font-family:Arial,Helvetica,sans-serif;color:#0d1b2e;margin:0;font-size:12px}
  .top{background:#0d1b2e;color:#fff;padding:16px 28px;border-bottom:3px solid #185FA5;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:700;letter-spacing:.08em}.brand small{color:#9db4d0;font-weight:400}
  .doc{padding:22px 28px}h1{font-size:18px;margin:0 0 4px}.meta{color:#64748b;font-size:11px;margin-bottom:16px}.meta b{color:#0d1b2e}
  section{margin-bottom:14px}h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#185FA5;border-bottom:1px solid #e2e8f0;padding-bottom:4px;margin:0 0 6px}
  table{width:100%;border-collapse:collapse}td{padding:4px 8px;border-bottom:1px solid #f1f5f9}td.k{color:#64748b;width:45%}
  .sig{height:70px;border:1px solid #e2e8f0;border-radius:6px;display:flex;align-items:center;justify-content:center;width:260px;margin-top:6px}
  .ft{color:#94a3b8;font-size:10px;margin-top:20px;border-top:1px solid #e2e8f0;padding-top:8px}
  @media print{.noprint{display:none}}
 </style></head><body>
  <div class="top"><div class="brand">QEY TECHNICAL <small>/ Field Service Management</small></div><div style="font-size:11px;color:#9db4d0">${t.title}</div></div>
  <div class="doc"><h1>${t.title}</h1><div class="meta"><b>${a.site||'Site'}</b> · ${a.asset_tag||''} &nbsp;|&nbsp; Report ${a.report_no||'—'} · ${a.visit_date||''}<br>Engineer: ${a.engineer||'—'} · Generated ${new Date().toLocaleString('en-GB')}</div>
  ${t.sections.map(s=>`<section><h2>${s.title}</h2><table>${rows(s)}</table></section>`).join('')}
  <section><h2>Sign-off</h2><div style="display:flex;gap:30px"><div><div class="sig">${sig}</div><div style="font-size:11px;color:#64748b;margin-top:4px"><b>${a.engineer||'Engineer'}</b><br>Engineer · ${new Date().toLocaleDateString('en-GB')}</div></div></div></section>
  <div class="ft">Generated by the QEY FSM platform. Values outside specified pass bands should be reviewed by the responsible engineer.</div>
  <div class="noprint" style="margin-top:18px"><button onclick="window.print()" style="background:#185FA5;color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:13px">Print / Save as PDF</button></div>
  </div></body></html>`;
 const w=window.open('','_blank');
 if(!w){toast('Pop-up blocked — allow pop-ups to view the report',true);return;}
 w.document.write(html);w.document.close();
 toast('Report generated — auto-filed into “'+(t.jobType==='corrective'?'Service Reports':'PPM Reports')+'” (demo)');
}

/* init */
renderDashboard();
</script>
</body>
</html>
