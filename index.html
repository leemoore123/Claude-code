<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --board: #1e293b;
      --cell: #334155;
      --cell-hover: #475569;
      --x: #38bdf8;
      --o: #fb7185;
      --text: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
    }

    h1 { margin: 0; font-weight: 700; letter-spacing: 0.05em; font-size: 2.5rem; }
    .subtitle { margin: -1rem 0 0; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.8rem; }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 240px;
      padding: 1.5rem;
      background: var(--board);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }
    .card:hover { transform: translateY(-4px); border-color: var(--x); background: var(--cell); }

    .card .icon { font-size: 3rem; line-height: 1; }
    .card .name { font-size: 1.35rem; font-weight: 700; }
    .card .desc { font-size: 0.85rem; opacity: 0.7; line-height: 1.4; }

    .card.maze:hover { border-color: var(--o); }
  </style>
</head>
<body>
  <h1>Game Hub</h1>
  <p class="subtitle">Pick a game</p>

  <div class="menu">
    <a class="card tictactoe" href="tictactoe.html">
      <span class="icon">⭕</span>
      <span class="name">Tic-Tac-Toe</span>
      <span class="desc">Classic 3×3. Play a friend or beat the computer on three difficulty levels.</span>
    </a>

    <a class="card maze" href="maze.html">
      <span class="icon">🔫</span>
      <span class="name">Maze Shooter</span>
      <span class="desc">Blast through procedurally generated mazes. Shoot enemies and walls. Levels get harder.</span>
    </a>
  </div>
</body>
</html>
